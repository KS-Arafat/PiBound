server:
    chroot: ""
    use-syslog: no
    logfile: ""
    verbosity: 2
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    root-hints: /etc/unbound/my.conf.d/root.hints
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-below-nxdomain: yes
    harden-referral-path: yes
    hide-identity: yes
    hide-version: yes
    use-caps-for-id: yes
    qname-minimisation: yes
    edns-buffer-size: 1232
    prefetch: yes
    so-sndbuf: 400k
    so-rcvbuf: 400k
    access-control: 0.0.0.0/0 allow

forward-zone:
    name: "."
    forward-tls-upstream: no
    forward-addr: 1.1.1.1@53
    forward-addr: 9.9.9.9@53
